<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Vitalinux – Acceso</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg2: #ffffff;
      --bg3: #f1f5f9;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --text: #1e293b;
      --text2: #64748b;
      --accent: #2563eb;
      --accent2: #1d4ed8;
      --danger: #dc2626;
      --radius: 8px;
      --shadow: 0 1px 8px rgba(0,0,0,0.07);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: var(--shadow);
    }
    .brand { margin-bottom: 32px; }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .brand-title span { color: var(--accent); }
    .brand-sub { font-size: 13px; color: var(--text2); }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--border2);
      border-radius: var(--radius);
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      margin-top: 4px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent2); }
    .error {
      background: rgba(220,38,38,0.06);
      border: 1px solid rgba(220,38,38,0.25);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 16px;
      display: none;
    }
    /* Tarjeta agente */
    .agent-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }
    .agent-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .agent-sub { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
    .agent-cmd {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: all;
    }
    .agent-dl {
      display: inline-block;
      font-size: 12px;
      color: var(--text2);
      text-decoration: none;
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 4px 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .agent-dl:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="login-card">
      <div class="brand">
        <div class="brand-title">Inventario <span>Vitalinux</span></div>
        <div class="brand-sub">Sistema de gestión de equipos del instituto</div>
      </div>
      <div class="error" id="err"></div>
      <form id="loginForm">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="username" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Acceder →</button>
      </form>
    </div>

    <div class="agent-card">
      <div class="agent-title">Instalar agente en un equipo</div>
      <div class="agent-sub">Ejecuta como root en el equipo Vitalinux:</div>
      <div class="agent-cmd" id="curlCmd"></div>
      <a class="agent-dl" id="dlLink" href="/agente.sh" download="inventario-agente.sh">Descargar script</a>
    </div>
  </div>

  <script>
    const origin = window.location.origin;
    document.getElementById('curlCmd').textContent = `curl -fsSL ${origin}/agente.sh | sudo bash`;
    document.getElementById('dlLink').href = `${origin}/agente.sh`;

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.textContent = 'Accediendo...';
      btn.disabled = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await r.json();
        if (r.ok) {
          window.location.href = '/index.html';
        } else {
          err.textContent = data.error || 'Error de acceso';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Error de conexión con el servidor';
        err.style.display = 'block';
      }
      btn.textContent = 'Acceder →';
      btn.disabled = false;
    });
  </script>
</body>
</html>
