<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Vitalinux – Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1e293b;
      --accent: #00d4aa;
      --accent2: #3b82f6;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 60px rgba(0,212,170,0.05), 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 12px 12px 0 0;
    }
    .brand {
      margin-bottom: 36px;
    }
    .brand-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .brand-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .brand-title span { color: var(--accent); }
    .brand-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,170,0.1);
    }
    button[type=submit] {
      width: 100%;
      background: var(--accent);
      color: #0a0e1a;
      border: none;
      border-radius: 6px;
      padding: 13px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.05em;
    }
    button[type=submit]:hover { opacity: 0.9; transform: translateY(-1px); }
    button[type=submit]:active { transform: translateY(0); }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 16px;
      display: none;
    }
    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 24px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-label">MistikEdu</div>
      <div class="brand-title">Inventario<br><span>Vitalinux</span></div>
      <div class="brand-sub">Sistema de gestión de equipos del instituto</div>
    </div>
    <div class="error" id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button type="submit">Acceder →</button>
    </form>
    <div class="footer-note">INVENTARIO · v1.0 · ARAGÓN</div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.textContent = 'Accediendo...';
      btn.disabled = true;
      try {
        const r = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await r.json();
        if (r.ok) {
          window.location.href = '/index.html';
        } else {
          err.textContent = data.error || 'Error de acceso';
          err.style.display = 'block';
        }
      } catch {
        err.textContent = 'Error de conexión con el servidor';
        err.style.display = 'block';
      }
      btn.textContent = 'Acceder →';
      btn.disabled = false;
    });
  </script>
</body>
</html>
